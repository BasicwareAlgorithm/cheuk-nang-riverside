name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: ./

      - name: Run tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client
          retention-days: 90

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup-artifacts:
    name: Keep two latest Pages artifacts
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete older GitHub Pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { ...context.repo, per_page: 100 },
            );
            const pageArtifacts = artifacts
              .filter((artifact) => artifact.name === "github-pages")
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));
            const removableArtifacts = pageArtifacts.slice(2);

            core.info(`Keeping ${Math.min(pageArtifacts.length, 2)} GitHub Pages artifact(s).`);
            for (const artifact of removableArtifacts) {
              await github.rest.actions.deleteArtifact({
                ...context.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted ${artifact.name} artifact ${artifact.id}.`);
            }
